server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Draco 디코더가 .wasm으로 배포된다. MIME이 틀리면 브라우저가
    # 스트리밍 컴파일을 거부해 압축된 GLB를 열지 못한다.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # 파일 이름에 해시가 붙어 있어 내용이 바뀌면 이름도 바뀐다. 영구 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 진입점은 항상 새로 받아야 새 배포가 즉시 반영된다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 해시 라우팅이라 서버가 경로를 볼 일은 없지만, 직접 입력한 주소도 살려 둔다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 모델 파일이 브라우저 밖으로 나가지 않는 도구다. 외부로 끌려갈 여지를 줄인다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
