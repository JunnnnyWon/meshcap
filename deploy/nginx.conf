# 연산 API는 한 번 호출에 수 초의 CPU와 수백 메가바이트를 쓴다. 인터넷에 열리는
# 순간 아무나 반복 호출해 서버를 묶어 둘 수 있으므로 호출 빈도와 동시 연결을 제한한다.
# 정적 파일에는 걸지 않는다.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Draco 디코더가 .wasm으로 배포된다. MIME이 틀리면 브라우저가
    # 스트리밍 컴파일을 거부해 압축된 GLB를 열지 못한다.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # 파일 이름에 해시가 붙어 있어 내용이 바뀌면 이름도 바뀐다. 영구 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 진입점은 항상 새로 받아야 새 배포가 즉시 반영된다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 상태 확인은 값이 싸고 페이지를 열 때마다 불린다. 여기에 제한을 걸면
    # 새로고침 몇 번에 429가 떠서 앱이 서버가 죽은 것으로 오해한다.
    location = /api/health {
        proxy_pass http://api:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 연산 요청만 제한한다. 같은 출처라 CORS 설정이 필요 없다.
    location /api/ {
        # 한 번에 수 초의 CPU와 수백 메가바이트를 쓰는 요청이다. 분당 6회,
        # 순간적으로 3회까지 몰아 쓰는 것은 허용한다. 사람이 모델을 하나씩
        # 올려 보는 속도로는 걸릴 일이 없는 값이다.
        limit_req zone=api_rate burst=3 nodelay;
        limit_conn api_conn 2;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 터널을 거치면 원래 접속자 주소가 헤더로 온다. 없으면 그대로 둔다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 삼백만 삼각형이면 본문이 150MB를 넘는다. 기본 상한 1MB로는 즉시 413이 난다.
        client_max_body_size 512m;
        # 큰 본문을 디스크에 먼저 받아 두면 업로드가 끝날 때까지 연산이 시작되지
        # 않는다. 곧바로 흘려보내 왕복 시간을 줄인다.
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 해시 라우팅이라 서버가 경로를 볼 일은 없지만, 직접 입력한 주소도 살려 둔다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 모델 파일이 브라우저 밖으로 나가지 않는 도구다. 외부로 끌려갈 여지를 줄인다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
