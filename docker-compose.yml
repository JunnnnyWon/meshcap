name: meshcap

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: meshcap:latest
    container_name: meshcap
    restart: unless-stopped
    # 루프백에만 연다. 외부 노출은 Tailscale Serve가 맡으므로
    # 이 포트가 랜이나 인터넷에 직접 뚫려서는 안 된다.
    ports:
      - '127.0.0.1:${MESHCAP_PORT:-8788}:80'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
