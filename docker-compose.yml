name: meshcap

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: meshcap-web:latest
    container_name: meshcap-web
    restart: unless-stopped
    depends_on:
      - api
    # 루프백에만 연다. 외부 노출은 Tailscale Serve가 맡으므로
    # 이 포트가 랜이나 인터넷에 직접 뚫려서는 안 된다.
    ports:
      - '127.0.0.1:${MESHCAP_PORT:-8788}:80'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # 공개 도메인으로 내보내는 터널. 자격증명이 없으면 프로필이 꺼져 있어
  # 테일넷 전용으로만 돌아간다.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: meshcap-tunnel
    restart: unless-stopped
    profiles: ['public']
    depends_on:
      - web
    # 이미지 기본 사용자(nonroot)로는 호스트의 자격증명 파일을 읽을 수 없다.
    # 600 권한 그대로 두고 소유자로 실행하는 편이 파일 권한을 푸는 것보다 안전하다.
    user: '${MESHCAP_UID:-1000}:${MESHCAP_GID:-1000}'
    environment:
      TUNNEL_ORIGIN_CERT: /etc/cloudflared/cert.pem
      HOME: /tmp
    volumes:
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
      - ./deploy/cloudflared/config.yml:/etc/cloudflared-config/config.yml:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared-config/config.yml run ${MESHCAP_TUNNEL:-meshcap}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: meshcap-api:latest
    container_name: meshcap-api
    restart: unless-stopped
    # 포트를 호스트로 내보내지 않는다. nginx만 컨테이너 네트워크로 접근한다.
    expose:
      - '3000'
    environment:
      MAX_BODY_BYTES: '536870912'
    # 큰 메시를 다루므로 넉넉히 주되, 서버 전체를 잡아먹지는 않게 상한을 둔다.
    deploy:
      resources:
        limits:
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
