name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 배포는 여기서 하지 않는다. 실제 서비스는 테일넷 안의 junnnnyserver에서
# Docker로 돌아가며, scripts/deploy.sh가 그 역할을 맡는다.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 배포용 이미지가 깨지지 않는지만 확인한다. 레지스트리에 올리지는 않는다.
      - run: docker build -t meshcap:ci .
